<title>Reports — {{ batch_id }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<div class="page">
  <h1>Student reports</h1>
  <p class="subtitle">Batch {{ batch_id }}</p>

  <div class="card">
    <div class="top-actions">
      <span class="count" id="student-count">{{ students|length }} students</span>
      <div class="buttons">
        <a class="btn-secondary" href="/batch/{{ batch_id }}/validate">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Validate
        </a>
        <button class="btn-secondary" id="download-all-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Download all
        </button>
        <button class="btn-secondary" id="download-zip-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M9 8h2M9 12h2M9 16h2" stroke-linecap="round"/></svg>
          Download as zip
        </button>
      </div>
    </div>

    <table>
      <tbody id="student-rows">
        {% for s in students %}
        <tr data-student-id="{{ s.student_id }}">
          <td class="name">{{ s.name }}<br><span class="meta">{{ s.branch }}{% if s.year %} / {{ s.year }}{% endif %}</span></td>
          <td class="status-cell"><span class="status {{ s.status }}">{{ s.status|capitalize }}{% if s.status == "pending" %}<span class="dots"><span>.</span><span>.</span><span>.</span></span>{% endif %}</span></td>
          <td class="action-cell">
            <a class="link-btn" href="/batch/{{ batch_id }}/students/{{ s.student_id }}/dashboard">Dashboard</a>
            <button class="btn-secondary explore-btn" data-student-id="{{ s.student_id }}" data-name="{{ s.name }}">Explore</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="card explore-panel" id="explore-panel">
    <p class="section-label" id="explore-title">explore panel</p>
    <div class="perf-summary" id="explore-perf" style="display:none;"></div>
    <pre class="json-view" id="explore-json"></pre>
    <iframe class="pdf-preview" id="explore-pdf"></iframe>
    <div class="explore-actions">
      <button class="btn-secondary" id="explore-view-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        View
      </button>
      <button class="btn-primary" id="explore-download-btn" style="margin-top:0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download
      </button>
    </div>
  </div>
</div>

<script>
  window.BATCH_ID = "{{ batch_id }}";
</script>
<script src="{{ url_for('static', filename='js/students.js') }}"></script>
